version: "3.9"
services:
  api:
    build: ./backend
    environment:
      - SECRET_KEY=change_me
      - DEBUG=true               # true = logs détaillés (requêtes HTTP, debug)
      - USE_MOCK=false           # true = pas d’accès SNMP, renvoie des données simulées
      - SNMP_VERSION=3           # 2c ou 3 (le PDU IBM DPI répond en v3, utilisateur pduscript)
      - SNMP_COMMUNITY=public    # utilisé seulement si SNMP_VERSION=2c
      - SNMPV3_USER=pduscript
      # Niveau noAuthNoPriv : laissez les clés ci-dessous commentées.
      # Niveau authNoPriv : décommentez AUTH ; authPriv : décommentez aussi PRIV.
      # - SNMPV3_AUTH=MD5        # MD5 ou SHA
      # - SNMPV3_AUTH_KEY=pduscript
      # - SNMPV3_PRIV=AES        # DES ou AES
      # - SNMPV3_PRIV_KEY=yyyy
      - ALLOWED_ORIGINS=*
      # --- Export InfluxDB (tâche de fond, mesures globales + par prise) ---
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=pdu-dev-token
      - INFLUX_ORG=pdu
      - INFLUX_BUCKET=pdu
      - INFLUX_INTERVAL=30       # secondes entre deux collectes
    depends_on:
      - influxdb
    volumes:
      - ./data:/app/data
      - ./backend/models.yaml:/app/models.yaml
    ports:
      - "8000:8000"

  ui:
    build: ./frontend
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin       # à changer en production
      - DOCKER_INFLUXDB_INIT_ORG=pdu
      - DOCKER_INFLUXDB_INIT_BUCKET=pdu
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=pdu-dev-token # à changer en production
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin               # à changer en production
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
